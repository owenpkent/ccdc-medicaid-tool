name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly full scan so advisories that land after a merge still get caught.
    - cron: "27 3 * * 1"

# Least-privilege default; the analyze job elevates only what CodeQL needs.
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload results to the Security tab
      actions: read # required for CodeQL on private repos

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # Balanced default query suite; swap to security-extended for more
          # coverage at the cost of a longer run and more low-severity noise.
          queries: security-and-quality

      # Static analysis of source only; no build step needed for JS/TS.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
