name: Reading level

# Plain language is a v0.1 acceptance criterion (docs/spec-v0.1.md: "All copy is
# at or below 6th grade Flesch-Kincaid, verified by tool"). This workflow is
# that tool for the member-facing strings in the rule library.
#
# THRESHOLD: grade 6 (6th-grade Flesch-Kincaid).
#
# BLOCKING. The check annotates any string above grade 6 and exits non-zero,
# so copy that regresses past the target fails the build.
#
# It ran in warn-only mode from #63 until #64, because six of the ten strings
# predated the check and failing on them would have blocked every unrelated PR.
# Those six were rewritten, so the mode switch cost nothing and the guard is
# now real. If a rewrite genuinely cannot reach grade 6 without becoming
# misleading, accuracy wins: say so on the PR and raise it with a CCDC
# advocate rather than bending the copy to satisfy the formula.
#
# Spanish is deliberately out of scope: Flesch-Kincaid is calibrated on English
# and produces a meaningless number for Spanish text.

on:
  pull_request:
    branches: [main]
    paths:
      - "rules/co/letter-types.yaml"
      - "web/scripts/reading-level.mjs"
      - ".github/workflows/reading-level.yml"
  push:
    branches: [main]
    paths:
      - "rules/co/letter-types.yaml"
      - "web/scripts/reading-level.mjs"
      - ".github/workflows/reading-level.yml"

# Least-privilege default token: this workflow only reads the repo. Its output
# goes to the job log, the step summary, and inline annotations, none of which
# need write access.
permissions:
  contents: read

concurrency:
  group: reading-level-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reading-level:
    name: plain-language grade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # web/package.json requires npm >= 12 and web/.npmrc sets engine-strict,
      # so `npm ci` fails on the npm that ships with Node 22. See ci.yml for
      # why the floor exists.
      - name: Use npm 12
        run: npm install -g npm@12

      # The script needs js-yaml, already a devDependency in web/. Installing
      # from the lockfile keeps this reproducible and adds no new package. The
      # script itself makes no network calls and reads only the rule YAML.
      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Check reading level
        working-directory: web
        run: npm run check:reading-level -- --strict
