version: 2
updates:
  # Web app (Vite/React PWA) dependencies
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # TypeScript 7 cannot install: @typescript-eslint (8.65.0, the current
      # latest) declares peer typescript ">=4.8.4 <6.1.0". Remove this entry
      # when typescript-eslint ships a release whose peer range includes 7.x.
      # Tracked in issue #39.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # ESLint 10 has no accessible lint story yet: eslint-plugin-jsx-a11y's
      # latest release (6.10.2) peers eslint "^3 || ... || ^9", and the a11y
      # gate is non-negotiable. Remove when jsx-a11y supports eslint 10, and
      # bump the two together. Tracked in issue #40.
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
    groups:
      # React and its type packages must move together: bumping react without
      # react-dom (or @types/react without @types/react-dom) produces a peer
      # conflict that npm ci refuses to install. Listed first so these packages
      # land here rather than in dev-tooling.
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      # Batch the dev/build toolchain (vite, vitest, eslint, prettier, types)
      # so routine updates land as one reviewable PR. Majors are deliberately
      # excluded: grouping them produced unmergeable PRs where one package's
      # new major violated another's peer range (e.g. typescript 7 against
      # @typescript-eslint's <6.1.0 cap). Each major now gets its own PR.
      dev-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
        exclude-patterns:
          - '@types/react'
          - '@types/react-dom'

  # Root tooling dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # GitHub Actions workflow dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
